[project]
name = "qm8-research-harness"
version = "0.1.0"
description = "An agent that does research on QM8, and the referee that decides whether it did"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",       # OpenAI-compatible: vLLM, OpenRouter, or a hosted API
    "numpy>=1.26",
    "scipy>=1.11",       # bootstrap CIs, paired tests
    "scikit-learn>=1.3",
    "lightgbm>=4.0",     # the prediction layer — no LLM anywhere near it
    "rdkit>=2023.9",     # featurization: Morgan fingerprints + descriptors
    "tqdm>=4.66",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Without this, `uv pip install -e .` fails. PEP 517 falls back to setuptools,
# whose flat-layout auto-discovery refuses to guess when there are several
# top-level directories (analysis, docs, results, world, writeup) — so the
# documented first command of "Reproduce it" aborted before installing
# anything. `[tool.uv] package = false` does not cover this: it governs
# `uv sync` / `uv run`, not `uv pip install`.
#
# The harness is a set of flat modules, not a package, so name them explicitly
# rather than letting discovery guess. Anything importable from the repo root
# has to be listed here.
[tool.setuptools]
py-modules = [
    "agent",
    "critic",
    "evaluate",
    "features",
    "llm",
    "models",
    "selftest",
    "tools",
]

# Keeps `uv sync` / `uv run` from building the project, as before. It is
# deliberately NOT the mechanism that makes `uv pip install -e .` work — that is
# [build-system] plus [tool.setuptools] above.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
